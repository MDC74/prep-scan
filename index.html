<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="theme-color" content="#0b0e13"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Prep Scan"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Prep Scan</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E📦%3C/text%3E%3C/svg%3E">
<!-- CookStars · 📱 Prep Scan LIVE v1 (23/10/2026) — the same scanner on its own web page (e.g. GitHub Pages), so iPhones allow the live camera. Talks to Prep (server v39+) through its scanner door. · from Prep Scan v4 · v4: photo reading tries sideways / zoomed / smaller / high-contrast versions before giving up · v3: 📸 photo scanning (works on iPhone inside Google’s page) · v2: camera works on iPhone + Android (own barcode reader), keeps scanning, says why if the camera is blocked · — the boxing scanner. Lane → box → scan → close the box. Same sign-in codes as Prep; saves through Prep, so Boxing updates live. -->
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.hd{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px}.hd .sp{flex:1}.hd small{font-size:13px;color:var(--mut);font-weight:700}
.back{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:14px;height:42px;min-width:46px;font-size:20px;font-weight:900}
.save{font-size:12.5px;font-weight:900;border-radius:99px;padding:4px 10px;border:2px solid #3a3f4d;color:var(--mut)}.save.on{border-color:#F0A245;color:#F7B866}.save.bad{border-color:#E5484D;color:#ff9b9b;background:rgba(229,72,77,.15)}
.lane{border:3px solid var(--c);border-radius:22px;padding:18px;background:color-mix(in srgb,var(--c) 12%,transparent);text-align:left;color:var(--ink);width:100%;font:inherit}.lane b{font-size:24px;color:var(--c)}.lane div{font-size:14px;opacity:.85;margin-top:3px}.lane.off{opacity:.45}
.btn{border-radius:18px;padding:16px;text-align:center;font-weight:900;font-size:18px;border:3px solid var(--c,#3a3f4d);color:var(--c,var(--ink));background:color-mix(in srgb,var(--c,#3a3f4d) 12%,transparent);width:100%;font-family:inherit}.btn.solid{background:var(--c);color:#06231c}.btn:disabled{opacity:.4}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.box{border:4px solid var(--c);border-radius:24px;padding:12px;text-align:center;background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--ink);width:100%;font:inherit}.box span{font-size:14px;opacity:.85}.box b{display:block;font-size:48px;color:var(--c);letter-spacing:.06em;line-height:1.05}.box.hv{border-color:#E5484D;animation:hv 1.2s infinite}@keyframes hv{50%{box-shadow:0 0 26px rgba(229,72,77,.8)}}

.last{display:flex;gap:12px;align-items:center;border:2px solid var(--lc,#2EC4A4);border-radius:18px;padding:10px;background:color-mix(in srgb,var(--lc,#2EC4A4) 10%,transparent)}.last .pic{width:72px;height:72px;flex:0 0 72px;border-radius:12px;background:#fff center/contain no-repeat}.last .pic.none{background:#1b2230}.last .tx{flex:1;min-width:0}.last b{display:block;font-size:16px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.last small{color:var(--mut);font-size:13px}.last .ok{color:#4fe3c1;font-weight:900;font-size:26px;white-space:nowrap}

.bx{display:flex;justify-content:space-between;align-items:center;border:3px solid var(--c);border-radius:16px;padding:12px 14px;margin-bottom:8px;width:100%;background:color-mix(in srgb,var(--c) 10%,transparent);color:var(--ink);font:inherit}.bx b{color:var(--c);font-size:20px;letter-spacing:.06em}.bx.on{box-shadow:0 0 0 3px var(--c)}
.fld{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.fld button{border:2px solid #3a3f4d;border-radius:14px;padding:8px 4px;text-align:center;background:transparent;color:var(--ink);font:inherit}.fld button.on{border-color:#F0A245;color:#F7B866;box-shadow:0 0 0 2px rgba(240,162,69,.35)}.fld small{display:block;font-size:11px;opacity:.7}.fld b{font-size:22px}.fld .hv b{color:#ff6b6b}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pad button{background:#1b2230;border:0;border-radius:14px;padding:16px;text-align:center;font-size:24px;font-weight:900;color:var(--ink);font-family:inherit}
.in{width:100%;height:54px;border-radius:14px;border:2px solid #3a3f4d;background:rgba(0,0,0,.35);color:var(--ink);font-size:20px;padding:0 14px;font-family:inherit}
.who{display:flex;gap:10px}.who button{flex:1}.who button.on{box-shadow:0 0 0 3px var(--c)}
.note{font-size:13px;color:var(--mut);text-align:center}
.sup{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sup button{border:2px solid #3a3f4d;border-radius:14px;padding:12px 8px;background:transparent;color:var(--ink);font:inherit;font-weight:800}.sup button.on{border-color:#2EC4A4;background:rgba(46,196,164,.15)}
video{width:100%;border-radius:18px;background:#000}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:#1b2230;border:2px solid #3a3f4d;border-radius:99px;padding:10px 18px;font-weight:800;z-index:60;max-width:92vw;text-align:center}
</style></head><body><div id="app"></div><div id="ov"></div>
<script>
(function () {
  var TK = 'cs_prep_tok', tok = ''; try { tok = localStorage.getItem(TK) || ''; } catch (e) {}
  var D = null, PB = null, LANE = '', BOXID = '', LAST = null, UNDO = [], Q = [], QBUSY = false, QBAD = 0, LOADING = false, SCREEN = 'lanes', MODAL = '', WHO = 'prep', CLOSE = null, CAMSTREAM = null;
  var LC = { Standard: '#2EC4A4', DG: '#F0A245', Oversize: '#5B9CF6' }, LI = { Standard: '📦', DG: '⚠', Oversize: '📐' }, LN = ['Standard', 'DG', 'Oversize'];
  var $ = function (id) { return document.getElementById(id); }, E = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var AK = 'cs_scan_api', API = ''; try { var qp = new URLSearchParams(location.search).get('api'); if (qp) { localStorage.setItem(AK, qp); history.replaceState(null, '', location.pathname); } API = localStorage.getItem(AK) || ''; } catch (e) {}
  function run(fn) { var a = [].slice.call(arguments, 1), args = fn === 'opsd_prepLogin' ? a : [tok].concat(a); if (!API) return Promise.reject(new Error('NO_API'));
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }), redirect: 'follow' })
      .then(function (r) { if (!r.ok) throw new Error('Prep didn’t answer (' + r.status + ')'); return r.text(); })
      .then(function (t) { var j; try { j = JSON.parse(t); } catch (e) { throw new Error(/<html/i.test(t) ? 'Prep asked for a Google sign-in — set the Prep deployment to “Anyone”' : 'Unexpected answer from Prep'); } if (!j.ok) throw new Error(j.e || 'Prep said no'); return j.r; }); }
  window.ps_setApi = function () { var v = String(($('apiin') || {}).value || '').trim(); if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(v)) { toast('Paste the Prep link — it ends in /exec'); return; } API = v; try { localStorage.setItem(AK, v); } catch (e) {} paint(); };
  function toast(m) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600); }
  var AC = null; function snd(k) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); var o = AC.createOscillator(), g = AC.createGain(); o.connect(g); g.connect(AC.destination); o.frequency.value = k === 'bad' ? 200 : 880; g.gain.setValueAtTime(0.0001, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.25, AC.currentTime + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + (k === 'bad' ? 0.45 : 0.12)); o.start(); o.stop(AC.currentTime + 0.5); } catch (e) {} try { navigator.vibrate && navigator.vibrate(k === 'bad' ? [120, 80, 120] : 50); } catch (e) {} }
  /* ---------- data ---------- */
  function S() { return Object.assign({ heavyKg: 15, boxColours: ['#2EC4A4', '#F0A245', '#E5484D', '#9B7BFF', '#F472B6', '#5B9CF6'] }, (D && D.settings) || {}); }
  function col(b) { var C = S().boxColours; return C[((Number(b.no) || 1) - 1) % C.length]; }
  function picOf(fn, sku) { var P = (D && D.pics) || [], r = P.find(function (x) { return (fn && x[1] === fn) || (sku && x[0] === sku); }); if (r && r[3]) return r[3]; var L = ((D && D.inv && D.inv.lines) || []).find(function (x) { return x.image && ((fn && x.fnsku === fn) || (sku && x.sku === sku)); }); return L ? L.image : ''; }
  function asinOf(fn, sku) { var L = ((D && D.inv && D.inv.lines) || []).find(function (x) { return (fn && x.fnsku === fn) || (sku && x.sku === sku); }); if (L && L.asin) return L.asin; var r = ((D && D.pics) || []).find(function (x) { return (fn && x[1] === fn) || (sku && x[0] === sku); }); return r ? r[2] : ''; }
  function lane(l) { var lab = {}, P = PB || { boxes: [], items: [] };
    ((D && D.rcpts) || []).forEach(function (r) { if (r.status !== 'labelled' || (r.lane || 'Standard') !== l || !r.fnsku) return; var x = lab[r.fnsku] = lab[r.fnsku] || { fnsku: r.fnsku, sku: r.sku, item: r.item, units: 0 }; x.units += r.qty; });
    var boxes = P.boxes.filter(function (b) { return b.lane === l && b.status !== 'shipped'; }).sort(function (a, b) { return a.no - b.no; }), bid = {}; boxes.forEach(function (b) { bid[b.id] = b; });
    var shB = {}; P.boxes.forEach(function (b) { if (b.lane === l && b.status === 'shipped') shB[b.id] = 1; });
    var inBox = {}, shipped = {}; P.items.forEach(function (it) { if (bid[it.box]) { (inBox[it.fnsku] = inBox[it.fnsku] || {})[it.box] = it.qty; if (!lab[it.fnsku]) lab[it.fnsku] = { fnsku: it.fnsku, sku: it.sku, item: it.item, units: 0 }; } else if (shB[it.box]) shipped[it.fnsku] = (shipped[it.fnsku] || 0) + it.qty; });
    var rows = Object.keys(lab).map(function (f) { var x = lab[f], ib = inBox[f] || {}, boxed = Object.keys(ib).reduce(function (t, k) { return t + ib[k]; }, 0), toBox = Math.max(0, x.units - (shipped[f] || 0)); return { fnsku: f, sku: x.sku, item: x.item, units: toBox, boxed: boxed, left: Math.max(0, toBox - boxed), inBox: ib }; }).filter(function (r) { return r.units > 0 || r.boxed > 0; });
    return { rows: rows, boxes: boxes, units: rows.reduce(function (t, r) { return t + r.units; }, 0), boxed: rows.reduce(function (t, r) { return t + r.boxed; }, 0), left: rows.reduce(function (t, r) { return t + r.left; }, 0) }; }
  function boxUnits(d, b) { return d.rows.reduce(function (t, r) { return t + (r.inBox[b.id] || 0); }, 0); }
  function curBox(d) { return d.boxes.find(function (b) { return b.id === BOXID; }) || d.boxes[d.boxes.length - 1] || null; }
  function load(quiet) { if (LOADING) return; LOADING = true; if (!quiet) paint();
    Promise.all([run('opsd_prepBoot'), run('opsd_prepBoxData')]).then(function (r) { LOADING = false; if (Q.length) return; D = r[0]; PB = r[1]; paint(); }).catch(function (e) { LOADING = false; var m = String((e && e.message) || e); if (/SIGNED_OUT/.test(m)) { tok = ''; try { localStorage.removeItem(TK); } catch (x) {} SCREEN = 'login'; paint(); } else if (!quiet) { toast('⚠ ' + m); paint(); } }); }
  /* ---------- saving: one at a time, retried, never dropped ---------- */
  function q(fn, args, after) { Q.push({ fn: fn, args: args, after: after, n: 0 }); pump(); paintSave(); }
  function pump() { if (QBUSY || !Q.length) return; QBUSY = true; var j = Q[0], a = typeof j.args === 'function' ? j.args() : j.args;
    run.apply(null, [j.fn].concat(a)).then(function (r) { Q.shift(); QBUSY = false; QBAD = 0; if (j.after) try { j.after(r); } catch (e) {} paintSave(); pump(); })
      .catch(function (e) { QBUSY = false; j.n++; var m = String((e && e.message) || e); if (/SIGNED_OUT/.test(m)) { QBAD = 1; paintSave(); return; } if (j.n >= 4) { QBAD = 1; paintSave(); toast('⚠ Not saved yet — tap the red “not saved” to try again'); return; } setTimeout(pump, 800 * j.n); }); }
  window.addEventListener('beforeunload', function (e) { if (Q.length) { e.preventDefault(); e.returnValue = 'Still saving'; } });
  function paintSave() { var s = $('sv'); if (!s) return; s.className = 'save' + (QBAD ? ' bad' : Q.length ? ' on' : ''); s.textContent = QBAD ? '⚠ not saved · retry' : Q.length ? '⏳ saving ' + Q.length : '✓ saved'; }
  window.ps_retry = function () { if (!QBAD) return; QBAD = 0; Q.forEach(function (j) { j.n = 0; }); pump(); paintSave(); };
  /* ---------- screens ---------- */
  function paint() { var A = $('app');
    if (!API) { A.innerHTML = '<div class="hd">📱 Prep Scan</div><div style="font-size:15px;line-height:1.5">To connect, open Prep on the computer → <b>Boxing → 📱 Prep Scan</b> (it opens this page already connected).<br><br>Or paste your Prep link here (it ends in <b>/exec</b>):</div><input class="in" id="apiin" placeholder="https://script.google.com/macros/s/…/exec"><button class="btn solid" style="--c:#2EC4A4" onclick="ps_setApi()">Connect</button>'; return; }
    if (!tok) SCREEN = 'login';
    if (SCREEN === 'login') { A.innerHTML = '<div class="hd">📱 Prep Scan<span class="sp"></span></div><div style="font-size:15px;opacity:.85">Who’s scanning?</div><div class="who"><button class="btn' + (WHO === 'prep' ? ' on' : '') + '" style="--c:#2EC4A4" onclick="ps_who(\'prep\')">👥 Prep</button><button class="btn' + (WHO === 'martin' ? ' on' : '') + '" style="--c:#E879F9" onclick="ps_who(\'martin\')">👤 Martin</button></div><input class="in" id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Your Prep code"><button class="btn solid" style="--c:#2EC4A4" onclick="ps_login()">Sign in</button><div class="note">Same code as the Prep app.</div>'; var p = $('pin'); p.onkeydown = function (e) { if (e.key === 'Enter') ps_login(); }; setTimeout(function () { p.focus(); }, 50); return; }
    if (!D || !PB) { A.innerHTML = '<div class="hd">📱 Prep Scan</div><div class="note" style="margin-top:40px;font-size:16px">⏳ Loading the lanes…</div>'; if (!LOADING) load(); return; }
    if (SCREEN === 'lanes') { A.innerHTML = '<div class="hd">📱 Prep Scan<span class="sp"></span><span class="save" id="sv" onclick="ps_retry()"></span></div><div style="font-size:15px;opacity:.85">Which lane are you boxing?</div>' + LN.map(function (l) { var d = lane(l), nb = d.boxes.length; return '<button class="lane' + (d.units || nb ? '' : ' off') + '" style="--c:' + LC[l] + '" onclick="ps_lane(\'' + l + '\')"><b>' + LI[l] + ' ' + l + '</b><div>' + (d.units || nb ? d.left + ' to box · ' + d.boxed + ' boxed · ' + nb + ' box' + (nb === 1 ? '' : 'es') + ' open' : 'nothing to box') + '</div></button>'; }).join('') +
        '<div style="flex:1"></div><button class="btn" style="--c:#2EC4A4" onclick="ps_sup()">🧰 Ask Martin for supplies</button><button class="btn" style="--c:#8b95a7;font-size:15px;padding:10px" onclick="ps_reload()">↻ Refresh</button>'; paintSave(); return; }
    var d = lane(LANE), b = curBox(d), hv = b && Number(b.kg) > S().heavyKg, lc = LC[LANE];
    A.innerHTML = '<div class="hd"><button class="back" onclick="ps_home()">‹</button>' + LI[LANE] + ' ' + LANE + '<span class="sp"></span><small>' + d.boxed + ' of ' + d.units + ' boxed</small><span class="save" id="sv" onclick="ps_retry()"></span></div>' +
      (b ? '<button class="box' + (hv ? ' hv' : '') + '" style="--c:' + col(b) + '" onclick="ps_boxes()"><span>scanning into · tap to change</span><b>BOX ' + b.no + '</b><span>' + boxUnits(d, b) + ' unit' + (boxUnits(d, b) === 1 ? '' : 's') + (b.kg ? ' · ' + b.kg + ' kg' : '') + (hv ? ' · ⚠ HEAVY' : '') + '</span></button>' : '<button class="btn solid" style="--c:#2EC4A4;font-size:22px;padding:22px" onclick="ps_new()">＋ Start Box 1</button>') +
      '<div class="scan"><input id="sc" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="Scan or type a barcode">' + '<label class="cam cam2" title="Take a photo of the barcode">📸 Photo<input type="file" accept="image/*" capture="environment" onchange="ps_photo(this)" style="display:none"></label><button class="cam camL" onclick="ps_cam()">📷 Live</button>' + '<div class="t">' + (b ? ('Tap 📷 Live and point at the labels — each goes into Box ' + b.no) : 'Start a box first') + '</div></div>' +
      (LAST ? '<div class="last" style="--lc:' + (LAST.bad ? '#E5484D' : '#2EC4A4') + '"><div class="pic' + (LAST.img ? '' : ' none') + '" style="' + (LAST.img ? 'background-image:url(\'' + E(LAST.img) + '\')' : '') + '"></div><div class="tx"><b>' + E(LAST.item) + '</b><small>' + E(LAST.fnsku) + ' · ' + LAST.left + ' left to box</small></div><div class="ok">' + (LAST.bad ? '' : '＋1 ✓') + '</div></div>' : '<div class="note">Your last scan shows here, with its picture, so you can check it’s the right item.</div>') +
      '<div class="pills"><div class="pill">In this box<b>' + (b ? boxUnits(d, b) : 0) + '</b></div><div class="pill">Left in lane<b>' + d.left + '</b></div><div class="pill">Boxes<b>' + d.boxes.length + '</b></div></div>' +
      '<div class="row2"><button class="btn" style="--c:#E5484D;font-size:16px" onclick="ps_undo()"' + (UNDO.length ? '' : ' disabled') + '>↶ Undo last</button><button class="btn" style="--c:#F0A245;font-size:16px" onclick="ps_full()"' + (b ? '' : ' disabled') + '>Box full →</button></div>';
    paintSave(); var sc = $('sc'); sc.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); var v = sc.value; sc.value = ''; scan(v); } }; if (!MODAL) setTimeout(function () { try { sc.focus({ preventScroll: true }); } catch (e) { sc.focus(); } }, 30); }
  document.addEventListener('click', function (e) { if (SCREEN === 'scan' && !MODAL && !e.target.closest('input,button')) { var sc = $('sc'); if (sc) sc.focus(); } });
  window.ps_who = function (w) { WHO = w; paint(); };
  window.ps_login = function () { var pin = ($('pin') || {}).value || ''; if (!pin) return; run('opsd_prepLogin', WHO, pin).then(function (r) { tok = r.token; try { localStorage.setItem(TK, tok); } catch (e) {} SCREEN = 'lanes'; D = PB = null; paint(); }).catch(function (e) { snd('bad'); toast('⚠ ' + String((e && e.message) || e)); }); };
  window.ps_lane = function (l) { LANE = l; var d = lane(l); BOXID = d.boxes.length ? d.boxes[d.boxes.length - 1].id : ''; LAST = null; UNDO = []; SCREEN = 'scan'; paint(); };
  window.ps_home = function () { SCREEN = 'lanes'; paint(); };
